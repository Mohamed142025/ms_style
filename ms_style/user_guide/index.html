<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دليل ERPNext · Digital Roots</title>
  <meta name="description" content="دليل المستخدم الشامل لنظام ERPNext v16 بالعربي والإنجليزي — Digital Roots Solutions">
  <meta name="theme-color" content="#0E3B2E">
  <link rel="icon" href="assets/img/digital-roots-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Apply saved language/theme before first paint (no flash).
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('lang');
        if (q === 'ar' || q === 'en') localStorage.setItem('drg.lang', q);
        var l = localStorage.getItem('drg.lang'); var t = localStorage.getItem('drg.theme');
        var h = document.documentElement;
        if (l === 'en') { h.lang = 'en'; h.dir = 'ltr'; }
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) h.dataset.theme = 'dark';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">تخطَّ إلى المحتوى</a>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Digital Roots">
      <img src="assets/img/digital-roots-mark.svg" alt="" width="34" height="34">
      <span class="brand-text"><b>Digital Roots</b><small data-i18n="brandSub">دليل ERPNext</small></span>
    </a>
    <button class="search-trigger" id="searchBtn" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span data-i18n="searchPh">ابحث في الدليل… (مثال: فاتورة مبيعات)</span>
      <kbd>Ctrl K</kbd>
    </button>
    <div class="top-actions">
      <a class="pill-btn back-desk" id="backDesk" href="/desk" hidden><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/></svg><span data-i18n="backDesk">العودة للنظام</span></a>
      <button class="pill-btn" id="langBtn" aria-label="Language"><span class="lang-ar">EN</span><span class="lang-en">ع</span></button>
      <button class="icon-btn" id="themeBtn" aria-label="Theme">
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="dl-wrap">
        <button class="dl-btn" id="dlBtn" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>
          <span data-i18n="download">تحميل Word</span>
        </button>
        <div class="dl-menu" id="dlMenu" role="menu" hidden>
          <a role="menuitem" href="downloads/ERPNext-Guide-AR.docx" download><b>العربية</b><small>ERPNext-Guide-AR.docx</small></a>
          <a role="menuitem" href="downloads/ERPNext-Guide-EN.docx" download><b>English</b><small>ERPNext-Guide-EN.docx</small></a>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Contents">
      <div class="progress-card" id="progressCard"></div>
      <nav id="nav"></nav>
      <div class="side-foot">ERPNext v16 · <span data-i18n="edition">إصدار</span> <span id="ver"></span></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main id="main" tabindex="-1"></main>
  </div>

  <div class="search-modal" id="searchModal" role="dialog" aria-modal="true" aria-label="Search" hidden>
    <div class="search-box">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false">
        <button class="esc" id="searchClose">Esc</button>
      </div>
      <div class="search-filters" id="searchFilters"></div>
      <div class="search-results" id="searchResults" role="listbox"></div>
      <div class="search-foot"><span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="kNav">تنقل</span></span><span><kbd>Enter</kbd> <span data-i18n="kOpen">فتح</span></span><span><kbd>Esc</kbd> <span data-i18n="kClose">إغلاق</span></span></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden><figure><img alt=""><figcaption></figcaption></figure><button class="icon-btn lb-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/data/guide.js"></script>
  <script src="assets/js/workflow.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
