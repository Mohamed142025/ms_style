<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Loading">
  <!-- The brand mark come to life: the three bars hop in turn with a cartoon squash and
       stretch, the tallest one keeps an eye on things and blinks, and the roots drip
       down beneath the line. Self-contained, so it plays as an <img> or a CSS background. -->
  <style>
    .bar, .eyes, .root, .drop, .glow { transform-box: fill-box; }
    .bar { transform-origin: 50% 100%; animation: hop 1.8s cubic-bezier(.34, 1.56, .64, 1) infinite; }
    .b2 { animation-delay: .15s; }
    .b3 { animation-delay: .3s; }
    @keyframes hop {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      10% { transform: translateY(0) scale(1.14, .78); }
      32% { transform: translateY(-46px) scale(.9, 1.12); }
      52% { transform: translateY(0) scale(1.16, .8); }
      64% { transform: translateY(-8px) scale(.98, 1.03); }
      74% { transform: translateY(0) scale(1, 1); }
    }
    .eyes { transform-origin: 50% 50%; animation: blink 3.6s ease-in-out infinite; }
    @keyframes blink {
      0%, 44%, 50%, 92%, 100% { transform: scaleY(1); }
      47%, 95% { transform: scaleY(.08); }
    }
    .pupils { animation: look 3.6s ease-in-out infinite; }
    @keyframes look {
      0%, 20%, 100% { transform: translateX(0); }
      28%, 40% { transform: translateX(-5px); }
      58%, 74% { transform: translateX(5px); }
    }
    .root { transform-origin: 50% 0; animation: grow 1.8s ease-in-out infinite; }
    .drop { animation: drip 1.8s cubic-bezier(.5, 0, .5, 1.4) infinite; }
    .r2, .d2 { animation-delay: .2s; }
    .r3, .d3 { animation-delay: .4s; }
    @keyframes grow {
      0%, 100% { transform: scaleY(.35); }
      50% { transform: scaleY(1); }
    }
    @keyframes drip {
      0%, 100% { transform: translateY(-34px) scale(.7); opacity: .5; }
      50% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .glow { transform-origin: 50% 50%; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: .35; }
      50% { opacity: .9; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar, .eyes, .pupils, .root, .drop, .glow { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#34D399" stop-opacity=".35"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0E3B2E"/>
  <circle class="glow" cx="256" cy="230" r="230" fill="url(#halo)"/>

  <g fill="url(#bars)">
    <rect class="bar b1" x="120" y="168" width="54" height="84" rx="27"/>
    <rect class="bar b2" x="229" y="112" width="54" height="140" rx="27"/>
    <g class="bar b3">
      <rect x="338" y="66" width="54" height="186" rx="27"/>
      <g class="eyes">
        <circle cx="353" cy="104" r="11" fill="#fff"/>
        <circle cx="377" cy="104" r="11" fill="#fff"/>
        <g class="pupils" fill="#0E3B2E">
          <circle cx="355" cy="106" r="5.5"/>
          <circle cx="379" cy="106" r="5.5"/>
        </g>
      </g>
    </g>
  </g>
  <rect x="83" y="273" width="346" height="34" rx="17" fill="#34D399"/>

  <g fill="#F4F1EA">
    <rect class="root r1" x="132" y="320" width="28" height="70" rx="14"/>
    <rect class="root r2" x="241" y="320" width="28" height="100" rx="14"/>
    <rect class="root r3" x="350" y="320" width="28" height="132" rx="14"/>
    <circle class="drop d1" cx="146" cy="392" r="25"/>
    <circle class="drop d2" cx="255" cy="424" r="25"/>
    <circle class="drop d3" cx="364" cy="456" r="25"/>
  </g>
</svg>
