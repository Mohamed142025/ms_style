<!doctype html>
<html lang="{{ frappe.lang }}" dir="{{ 'rtl' if frappe.lang == 'ar' else 'ltr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4F1EA; color: #16211C; font-family: system-ui, "Segoe UI", Arial, sans-serif; }
    .card { max-width: 420px; margin: 16px; padding: 28px; border-radius: 18px; background: #fff; border: 1px solid rgba(14, 59, 46, .12); text-align: center; }
    h1 { margin: 0 0 8px; font-size: 22px; color: #0E3B2E; }
    p { margin: 0 0 18px; color: #5A6B63; line-height: 1.7; }
    a { display: inline-block; padding: 10px 18px; border-radius: 10px; background: #197B57; color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ _("User Guide") }}</h1>
    <p>{{ _("The user guide is available to system users only.") }}</p>
    <a href="/">{{ _("Home") }}</a>
  </div>
</body>
</html>
